name: Silent Hill Online (Windows)

# Builds Silent Hill Online for Windows on every push to main and publishes it
# to this repo's rolling `realtime` release (tools/online_realtime_publish.py),
# which the online launcher follows by default. Online has no other release
# stream: players can only play together on the same build.
#
# The inherited single-player workflows (build-*.yml) only run in
# SlickAmogus/silent-hill-decomp, so they never fire here; keeping online CI in
# its own files keeps pc-port merges free of workflow conflicts.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: online-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'SlickAmogus/silenthill-online'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout (with PsyCross submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 MinGW x64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-openal
            mingw-w64-x86_64-libjpeg-turbo

      # Headers only, pinned to the FFmpeg 8 the carried runtime DLLs are (see
      # build-windows.yml). Optional: without them the FMV fallback is compiled out.
      - name: ffmpeg 8 headers (optional, pinned)
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -euo pipefail
          PKG=mingw-w64-x86_64-ffmpeg-8.0.1-7-any.pkg.tar.zst
          FF="$(cygpath -u "$RUNNER_TEMP")/ffmpeg8"
          mkdir -p "$FF"
          curl -fsSL --retry 3 -o "$FF/$PKG" "https://repo.msys2.org/mingw/mingw64/$PKG"
          tar --zstd -xf "$FF/$PKG" -C "$FF" --wildcards 'mingw64/include/libav*' 'mingw64/include/libsw*'
          grep -m1 LIBAVCODEC_VERSION_MAJOR "$FF/mingw64/include/libavcodec/version_major.h"
          echo "FFMPEG_PREFIX=$(cygpath -m "$FF")/mingw64" >> "$GITHUB_ENV"

      - name: Build (Ninja + map DLLs)
        run: |
          FFARG=()
          if [ -n "${FFMPEG_PREFIX:-}" ]; then
            FFARG=(-DSH_FFMPEG_PREFIX="$FFMPEG_PREFIX")
          else
            echo "::warning::Pinned ffmpeg headers unavailable; this build has the FMV fallback compiled out."
          fi
          cmake -S pc_port -B pc_port/build -G Ninja -DSH_BUILD_MAP_DLLS=ON "${FFARG[@]}"
          cmake --build pc_port/build -- -k 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build the launcher
        shell: pwsh
        run: |
          msbuild pc_port/launcher/SilentHillPC_Launcher/SilentHillPC_Launcher.csproj /p:Configuration=Release /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage release files
        run: |
          set -euo pipefail
          STAGE="$(cygpath -u "$RUNNER_TEMP")/SHOnline-windows-x64"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/maps"
          cp pc_port/build/SilentHillPC.exe "$STAGE/"
          cp pc_port/build/maps/*.dll       "$STAGE/maps/"
          cp pc_port/config.cfg             "$STAGE/config.cfg"
          cp -r pc_port/assets/.            "$STAGE/"
          cp pc_port/launcher/SilentHillPC_Launcher/bin/Release/SilentHillPC_Launcher.exe "$STAGE/"
          # The exe and map DLLs link against this toolchain's runtime, so ship
          # the MinGW-prefix DLLs they import (recursively), never another build's.
          queue=("$STAGE/SilentHillPC.exe" "$STAGE"/maps/*.dll)
          while [ ${#queue[@]} -gt 0 ]; do
            pe="${queue[0]}"; queue=("${queue[@]:1}")
            for dll in $(objdump -p "$pe" | sed -n 's/^\s*DLL Name: //p'); do
              src="/mingw64/bin/$dll"
              if [ -f "$src" ] && [ ! -f "$STAGE/$dll" ]; then
                cp "$src" "$STAGE/"
                queue+=("$STAGE/$dll")
              fi
            done
          done
          echo "Bundled runtime DLLs:"; ls "$STAGE"/*.dll

      # The launcher only replaces itself with a strictly newer version, so the
      # publisher records the version this build carries.
      - name: Record the launcher version
        shell: pwsh
        run: |
          $v = (Get-Item pc_port/launcher/SilentHillPC_Launcher/bin/Release/SilentHillPC_Launcher.exe).VersionInfo.FileVersion
          Set-Content -NoNewline -Encoding ascii -Path "$env:RUNNER_TEMP/SHOnline-windows-x64/launcher_version.txt" -Value $v
          "Launcher $v"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHOnline-windows-x64
          path: ${{ runner.temp }}/SHOnline-windows-x64
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.repository == 'SlickAmogus/silenthill-online' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # Publishes edit one shared index, so they run one at a time and never cancel
    # each other mid-upload.
    concurrency:
      group: online-realtime-publish
      cancel-in-progress: false

    steps:
      - name: Checkout (history for the changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: SHOnline-windows-x64
          path: ${{ runner.temp }}/stage

      - name: Publish to the realtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/online_realtime_publish.py \
            --stage "$RUNNER_TEMP/stage" \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --run "$GITHUB_RUN_NUMBER"

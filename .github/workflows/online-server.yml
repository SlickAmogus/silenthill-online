name: Silent Hill Online (server)

# Builds the living world server (online_server/sh_master.c) for Linux x64,
# Linux arm64 and Windows, runs the protocol self-test against the Linux build,
# and publishes everything with the host scripts (online_server/host/) to this
# repo's rolling `server` pre-release, so anyone can run their own server from
# files that are always current. Runs only when server files change.

on:
  push:
    branches:
      - main
    paths:
      - 'online_server/**'
      - 'pc_port/include/sh_net_proto.h'
      - 'pc_port/include/sh_net_memo_text.h'
      - 'pc_port/include/sh_net_chat_filter.h'
      - '.github/workflows/online-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: online-server
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'SlickAmogus/silenthill-online'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cross compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 gcc-aarch64-linux-gnu zip

      - name: Build
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/SHOnline-server"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          CFLAGS="-O2 -Wall -Wextra -static -I pc_port/include"
          gcc                     $CFLAGS -o "$STAGE/sh_master-linux-x64"   online_server/sh_master.c
          aarch64-linux-gnu-gcc   $CFLAGS -o "$STAGE/sh_master-linux-arm64" online_server/sh_master.c
          x86_64-w64-mingw32-gcc  $CFLAGS -o "$STAGE/sh_master.exe"         online_server/sh_master.c -lws2_32
          gcc -O2 -I pc_port/include -o "$RUNNER_TEMP/shnet_selftest" online_server/shnet_selftest.c
          cp online_server/sh_master.c pc_port/include/sh_net_proto.h pc_port/include/sh_net_memo_text.h pc_port/include/sh_net_chat_filter.h "$STAGE/"
          cp online_server/host/* "$STAGE/"
          # The batch files must stay CRLF whatever the checkout did.
          for f in "$STAGE"/*.bat; do sed -i 's/\r$//; s/$/\r/' "$f"; done
          chmod 755 "$STAGE"/sh_master-linux-* "$STAGE"/install-server.sh
          printf 'commit %s\nbuilt  %s UTC\nproto  %s\n' "$GITHUB_SHA" "$(date -u '+%Y-%m-%d %H:%M:%S')" \
            "$(sed -n 's/^#define SHNET_PROTO_VER *\([0-9]*\).*/\1/p' pc_port/include/sh_net_proto.h)" > "$STAGE/version.txt"
          ls -la "$STAGE"

      # The self-test speaks the wire protocol from the same header as the game,
      # over UDP and again over WebSocket the way the browser build connects.
      - name: Self-test the Linux build
        timeout-minutes: 5
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/SHOnline-server/sh_master-linux-x64"
          "$S" --help >/dev/null
          # Each pass gets a fresh server and marker store: the test inspects the
          # first marker on a map and expects its own.
          for MODE in udp ws; do
            rm -f "$RUNNER_TEMP/selftest.db"
            "$S" -p 27899 --ws 27900 --admin 27898 -d "$RUNNER_TEMP/selftest.db" -i 100 --max 128 > "$RUNNER_TEMP/server-$MODE.log" 2>&1 &
            SRV=$!
            sleep 1
            if [ "$MODE" = udp ]; then
              "$RUNNER_TEMP/shnet_selftest" 127.0.0.1 27899
            else
              "$RUNNER_TEMP/shnet_selftest" --ws 27900 127.0.0.1 27899
            fi
            "$S" --admin 27898 --cmd players
            kill $SRV; wait $SRV || true
            tail -3 "$RUNNER_TEMP/server-$MODE.log"
          done

      - name: Zip
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -f SHOnline-server.zip
          zip -r -9 SHOnline-server.zip SHOnline-server
          ls -la SHOnline-server.zip

      - name: Publish to the server release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=server
          STAGE="$RUNNER_TEMP/SHOnline-server"
          SHORT="${GITHUB_SHA:0:9}"
          DATE="$(date -u '+%Y-%m-%d %H:%M')"
          PROTO="$(sed -n 's/^#define SHNET_PROTO_VER *\([0-9]*\).*/\1/p' pc_port/include/sh_net_proto.h)"
          NOTES="$(cat <<EOF
          The Silent Hill Online living world server, for anyone who wants to run their own: outlines, markers, messages and the room list. Rebuilt here whenever the server changes, so these files are always current.

          **Newest server: \`$SHORT\`, $DATE UTC, protocol v$PROTO**

          - **SHOnline-server.zip**: everything below plus the scripts. Unzip it, fill in \`server.txt\`, then double-click **Redeploy-Server.bat** to install or update the server on a Linux machine over ssh, **Server-Console.bat** for its admin console (players, kick, ban, prune, say), or **Start-Server.bat** to run it on this Windows PC. Full instructions in the zip's README, also [here](https://github.com/$GITHUB_REPOSITORY/blob/main/online_server/host/README.md).
          - \`sh_master-linux-x64\`, \`sh_master-linux-arm64\`: the server for Linux, static, no dependencies.
          - \`sh_master.exe\`: the server for Windows.
          - \`install-server.sh\`: run it on the Linux machine itself if you are not on Windows (\`sudo bash install-server.sh --args '-n "Fog"'\`).

          Players reach your server by typing its address as the **Living World IP** in the Multiplayer menu. It takes 512 players by default (\`--max\`, up to 1024). Updating it drops the co-op rooms in progress, so pick a quiet hour; the game only has to match the server when the protocol version above changes.
          EOF
          )"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "Silent Hill Online: server (host your own)" --notes "$NOTES"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$RUNNER_TEMP/SHOnline-server.zip" \
            "$STAGE/sh_master-linux-x64" "$STAGE/sh_master-linux-arm64" "$STAGE/sh_master.exe" \
            "$STAGE/install-server.sh" "$STAGE/version.txt"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --notes "$NOTES"
          echo "Published $SHORT to the $TAG release."
